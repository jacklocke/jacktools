## POWERLINE configuration
set -g default-terminal "screen-256color"
# solo se powerline è installato (altrimenti tmux segnala un errore a ogni avvio)
if-shell 'test -f /usr/share/powerline/bindings/tmux/powerline.conf' 'source-file /usr/share/powerline/bindings/tmux/powerline.conf'
# Hostname prima della sessione, con i colori del tema (deve seguire powerline; solo con il tema powerline di JackTools)
if-shell 'test -f ~/.config/powerline/tools/tmux-hostname.py' "run-shell 'python3 ~/.config/powerline/tools/tmux-hostname.py'"

## CONFIGURAZIONI
# CTRL + A   ?     riepilogo delle scorciatoie (CTRL + A  K = elenco completo di tmux)

# remap prefix da 'CTRL-b' a 'CTRL-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Split h e v con i tasti - e _
bind _ split-window -h
bind - split-window -v
unbind '"'
unbind %

# Selector for Copy and Paste
bind c copy-mode
bind v paste-buffer
#CTRL+ space per selezionare muovendosi
bind-key -T copy-mode C-c send-keys -X copy-selection-and-cancel
bind-key -T copy-mode C-x send-keys -X cancel

# Resize
bind i resize-pane -U 3
bind j resize-pane -L 3
bind k resize-pane -D 3
bind l resize-pane -R 3

# Windows
bind-key -T prefix w choose-tree -w
bind-key -T prefix n new-window

# Panes
bind-key -T prefix z resize-pane -Z

# Mouse (clic su pane/finestre, rotella, trascinare i bordi; Shift+selezione = selezione del terminale)
set -g mouse on
# Il testo copiato in tmux va negli appunti del PC via OSC52 (Windows Terminal, anche in SSH)
set -g set-clipboard on

# Alt + frecce: cambia pane senza prefisso
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Alt + i/j/k/l (come CTRL+A i/j/k/l) e Alt + Shift + frecce: ridimensiona senza prefisso
bind -n M-i resize-pane -U 3
bind -n M-j resize-pane -L 3
bind -n M-k resize-pane -D 3
bind -n M-l resize-pane -R 3
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Left resize-pane -L 3
bind -n M-S-Down resize-pane -D 3
bind -n M-S-Right resize-pane -R 3

# Finestre e pane numerati da 1, rinumerati quando se ne chiude uno
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Barra in alto e titolo su ogni pane
set -g status-position top
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} #{b:pane_current_path} "

# Popup: CTRL+A M = htop, CTRL+A D = dockly (solo se htop / docker sono installati)
if-shell 'command -v htop' 'bind M display-popup -E -w 90% -h 85% htop'
if-shell 'command -v docker' 'bind D display-popup -E -w 95% -h 90% "docker run -it --rm -v /var/run/docker.sock:/var/run/docker.sock lirantal/dockly"'

# Attività: una finestra in background si colora quando produce output
setw -g monitor-activity on
set -g visual-activity off

# Pane inattivi con il testo attenuato: si vede subito dove si scrive
set -g window-style 'fg=colour245'
set -g window-active-style 'fg=terminal'

# CTRL+A t = shell al volo nella cartella del pane (si chiude con exit)
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 75%

# CTRL+A ? = riepilogo delle scorciatoie (se c'è il tema powerline), CTRL+A K = elenco completo
bind K list-keys
if-shell 'test -f ~/.config/powerline/tools/tmux-keys.txt' 'bind ? display-popup -E -w 84 -h 90% "less -R ~/.config/powerline/tools/tmux-keys.txt"'

# Tasto destro sulla barra (finestre e parte destra): menu rapido.
# Le voci senza il comando o il file che servono restano visibili ma disattivate.
set -g @has_htop 0
set -g @has_docker 0
set -g @has_theme 0
if-shell 'command -v htop' 'set -g @has_htop 1'
if-shell 'command -v docker' 'set -g @has_docker 1'
if-shell 'test -x ~/.config/powerline/tools/theme-menu.sh' 'set -g @has_theme 1'
# Lo stesso menu per le due zone (scritto due volte: serve il contesto del clic)
bind -n MouseDown3Status display-menu -T "#[align=centre] tmux " -t = -x M -y W \
    "Nuova finestra" n { new-window } \
    "Dividi: affiancati" _ { split-window -h } \
    "Dividi: uno sopra l altro" - { split-window -v } \
    "" \
    "Shell al volo" t { display-popup -E -d "#{pane_current_path}" -w 80% -h 75% } \
    "#{?@has_htop,,-}htop" M { display-popup -E -w 90% -h 85% htop } \
    "#{?@has_docker,,-}dockly" D { display-popup -E -w 95% -h 90% "docker run -it --rm -v /var/run/docker.sock:/var/run/docker.sock lirantal/dockly" } \
    "" \
    "#{?@has_theme,,-}Cambia tema" T { run-shell "~/.config/powerline/tools/theme-menu.sh #{q:client_name}" } \
    "" \
    "Rinomina finestra" , { command-prompt -I "#W" { rename-window -- "%%" } } \
    "Chiudi finestra" X { kill-window }
bind -n MouseDown3StatusRight display-menu -T "#[align=centre] tmux " -t = -x M -y W \
    "Nuova finestra" n { new-window } \
    "Dividi: affiancati" _ { split-window -h } \
    "Dividi: uno sopra l altro" - { split-window -v } \
    "" \
    "Shell al volo" t { display-popup -E -d "#{pane_current_path}" -w 80% -h 75% } \
    "#{?@has_htop,,-}htop" M { display-popup -E -w 90% -h 85% htop } \
    "#{?@has_docker,,-}dockly" D { display-popup -E -w 95% -h 90% "docker run -it --rm -v /var/run/docker.sock:/var/run/docker.sock lirantal/dockly" } \
    "" \
    "#{?@has_theme,,-}Cambia tema" T { run-shell "~/.config/powerline/tools/theme-menu.sh #{q:client_name}" } \
    "" \
    "Rinomina finestra" , { command-prompt -I "#W" { rename-window -- "%%" } } \
    "Chiudi finestra" X { kill-window }
